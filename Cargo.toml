# Copyright The eha-tool Contributors

[workspace]
resolver = "3"

[package]
name = "eha-tool"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
eha-sdk = { path = "../eha-sdk" }
rustyline = { version = "18.0.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
shlex = "2.0.1"
tiny_http = "0.12"

[workspace.package]
edition = "2024"
version = "4.0.0-dev.2"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
panic = "abort"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
unreachable = "deny"
